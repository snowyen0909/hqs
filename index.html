<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界通史單字測驗</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .quiz-container {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
        position: relative;
    }
    h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 20px;
    }
    .question-info {
        color: #666;
        margin-bottom: 15px;
        font-size: 16px;
    }
    .english-word {
        font-size: 32px;
        color: #0056b3;
        font-weight: bold;
        margin-bottom: 20px;
    }
    input[type="text"] {
        width: 80%;
        padding: 10px;
        font-size: 18px;
        border: 2px solid #ccc;
        border-radius: 5px;
        margin-bottom: 20px;
        outline: none;
        box-sizing: border-box;
    }
    input[type="text"]:focus {
        border-color: #0056b3;
    }
    button {
        background-color: #0056b3;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin: 5px;
    }
    button:hover {
        background-color: #004494;
    }
    button:disabled {
        background-color: #ccc !important;
        color: #666 !important;
        cursor: not-allowed;
    }
    .btn-skip {
        background-color: #dc3545;
    }
    .btn-skip:hover {
        background-color: #c82333;
    }
    .btn-secondary {
        background-color: #6c757d;
    }
    .btn-secondary:hover {
        background-color: #5a6268;
    }
    .btn-warning {
        background-color: #ffc107;
        color: #212529;
        font-weight: bold;
    }
    .btn-warning:hover {
        background-color: #e0a800;
    }
    .btn-small {
        padding: 5px 10px;
        font-size: 14px;
        margin: 0;
    }
    .feedback {
        margin-top: 15px;
        font-size: 16px;
        font-weight: bold;
        min-height: 24px;
    }
    .correct { color: green; }
    .incorrect { color: red; }
    .hidden { display: none !important; }
    #result-screen h2 {
        font-size: 28px;
        color: #333;
    }
    .history-list {
        text-align: left;
        max-height: 350px;
        overflow-y: auto;
        margin-bottom: 20px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 5px;
    }
    .history-item {
        margin-bottom: 10px;
        border-bottom: 1px solid #dee2e6;
        padding-bottom: 10px;
    }
    .history-item:last-child {
        border-bottom: none;
    }
    .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .history-details {
        margin-top: 10px;
        background: #fff;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #eee;
        font-size: 14px;
    }
    .history-details ul {
        padding-left: 20px;
        margin-bottom: 0;
    }
    .history-details li {
        margin-bottom: 8px;
    }
</style>
</head>
<body>

<div class="quiz-container" id="start-screen">
    <h1>世界通史單字測驗</h1>
    <p>每次隨機抽取 20 題，顯示英文請輸入中文。</p>
    <p style="color: #666; font-size: 14px;">（註：若有多個答案，填入其中一個即可）</p>
    <div>
        <button id="start-btn" onclick="startQuiz()" disabled>單字載入中...</button>
        <button class="btn-secondary" onclick="viewHistory()">歷史紀錄</button>
    </div>
    <div style="margin-top: 10px;">
        <button id="review-btn" class="btn-warning" onclick="startReviewQuiz()" disabled>錯題複習 (載入中...)</button>
    </div>
</div>

<div class="quiz-container hidden" id="history-screen">
    <h1>測驗歷史紀錄</h1>
    <div id="history-content" class="history-list"></div>
    <button onclick="closeHistory()">返回首頁</button>
    <button class="btn-skip" onclick="clearHistory()">清除紀錄</button>
</div>

<div class="quiz-container hidden" id="quiz-screen">
    <h1 id="quiz-title">世界通史單字測驗</h1>
    <div class="question-info" id="question-counter">題數: 1 / 20</div>
    <div class="english-word" id="english-word">English</div>
    <input type="text" id="answer-input" placeholder="請輸入中文..." onkeypress="handleKeyPress(event)">
    <br>
    <button id="submit-btn" onclick="checkAnswer()">提交</button>
    <button id="skip-btn" class="btn-skip" onclick="skipQuestion()">我不會</button>
    <div class="feedback" id="feedback"></div>
</div>

<div class="quiz-container hidden" id="result-screen">
    <h1>測驗結束！</h1>
    <h2 id="final-score">你的分數: 0 / 20</h2>
    <div id="mistakes-list" style="text-align: left; margin: 20px 0; max-height: 200px; overflow-y: auto;"></div>
    <button onclick="resetQuiz()">回首頁</button>
</div>

<script>
    let allVocab = []; 
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];
    let waitingForNext = false;
    let isReviewMode = false; // 判斷現在是否為錯題複習模式

    const jsonUrl = 'https://raw.githubusercontent.com/snowyen0909/loon-2/refs/heads/main/Qs.json';

    // 網頁載入時自動抓取單字表
    window.onload = async function() {
        const startBtn = document.getElementById('start-btn');
        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error('網路連線發生問題');
            allVocab = await response.json();
            
            startBtn.innerText = '隨機測驗 20 題';
            startBtn.disabled = false;
            
            // 更新錯題按鈕狀態
            updateReviewButton();
        } catch (error) {
            console.error('載入單字表失敗:', error);
            startBtn.innerText = '載入失敗，請確認網址或重整網頁';
            startBtn.style.backgroundColor = '#dc3545';
        }
    };

    // 取得歷史紀錄中所有「曾經答錯過」的單字
    function getMistakeVocab() {
        let history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
        let mistakeMap = new Map();

        // 收集所有錯過的英文單字
        history.forEach(record => {
            if (record.mistakes) {
                record.mistakes.forEach(m => {
                    mistakeMap.set(m.en, true);
                });
            }
        });

        // 從主字庫比對抓出完整的單字資料 {en: ..., zh: [...]}
        return allVocab.filter(vocab => mistakeMap.has(vocab.en));
    }

    // 更新錯題按鈕文字與狀態
    function updateReviewButton() {
        const reviewBtn = document.getElementById('review-btn');
        if (!reviewBtn || allVocab.length === 0) return;

        const mistakeVocab = getMistakeVocab();
        if (mistakeVocab.length > 0) {
            reviewBtn.innerText = `💪 錯題特訓 (${mistakeVocab.length} 題)`;
            reviewBtn.disabled = false;
        } else {
            reviewBtn.innerText = `錯題特訓 (目前無錯題 🎉)`;
            reviewBtn.disabled = true;
        }
    }

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 一般隨機測驗
    function startQuiz() {
        if (allVocab.length === 0) return;
        isReviewMode = false;
        const questionCount = Math.min(20, allVocab.length);
        startTestFlow(shuffleArray([...allVocab]).slice(0, questionCount), "世界通史單字測驗");
    }

    // 錯題複習測驗
    function startReviewQuiz() {
        const mistakeVocab = getMistakeVocab();
        if (mistakeVocab.length === 0) return;
        isReviewMode = true;
        
        // 錯題複習如果超過 20 題，一樣先抽 20 題；不到 20 題就全考
        const questionCount = Math.min(20, mistakeVocab.length);
        startTestFlow(shuffleArray([...mistakeVocab]).slice(0, questionCount), "💪 錯題特訓模式");
    }

    // 共用的測驗啟動流程
    function startTestFlow(questions, title) {
        currentQuestions = questions;
        currentIndex = 0;
        score = 0;
        mistakes = [];
        waitingForNext = false;

        document.getElementById('quiz-title').innerText = title;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('history-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('question-counter').innerText = `題數: ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('english-word').innerText = currentQuestions[currentIndex].en;
        document.getElementById('answer-input').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('answer-input').focus();
        
        document.getElementById('submit-btn').innerText = '提交';
        document.getElementById('skip-btn').classList.remove('hidden');
        waitingForNext = false;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            if (waitingForNext) nextQuestion();
            else checkAnswer();
        }
    }

    function checkAnswer() {
        if (waitingForNext) {
            nextQuestion();
            return;
        }

        const input = document.getElementById('answer-input').value.trim();
        if (input === '') return; 

        const currentVocab = currentQuestions[currentIndex];
        const isCorrect = currentVocab.zh.some(ans => ans.trim() === input);
        const feedbackEl = document.getElementById('feedback');

        if (isCorrect) {
            score++;
            feedbackEl.innerHTML = '<span class="correct">答對了！</span>';
        } else {
            const correctAnswersStr = currentVocab.zh.join(' 或 ');
            feedbackEl.innerHTML = `<span class="incorrect">答錯了，正確答案是：${correctAnswersStr}</span>`;
            mistakes.push({ en: currentVocab.en, yourAnswer: input, correct: correctAnswersStr });
        }

        setToNextState();
    }

    function skipQuestion() {
        if (waitingForNext) return;

        const currentVocab = currentQuestions[currentIndex];
        const correctAnswersStr = currentVocab.zh.join(' 或 ');
        const feedbackEl = document.getElementById('feedback');
        
        feedbackEl.innerHTML = `<span class="incorrect">未作答，正確答案是：${correctAnswersStr}</span>`;
        mistakes.push({ en: currentVocab.en, yourAnswer: "未作答", correct: correctAnswersStr });

        setToNextState();
    }

    function setToNextState() {
        waitingForNext = true;
        document.getElementById('submit-btn').innerText = '下一題';
        document.getElementById('skip-btn').classList.add('hidden'); 
        document.getElementById('submit-btn').focus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `你的分數: ${score} / ${currentQuestions.length}`;
        
        // 儲存紀錄 (錯題特訓模式的成績也會被記錄下來，幫助你追蹤複習成效)
        let modeTag = isReviewMode ? " (錯題特訓)" : "";
        saveHistory(score, currentQuestions.length, mistakes, modeTag);

        const mistakesList = document.getElementById('mistakes-list');
        if (mistakes.length > 0) {
            let html = '<h3>需要複習的單字：</h3><ul>';
            mistakes.forEach(m => {
                html += `<li><b>${m.en}</b> - 正確: <span style="color:green;">${m.correct}</span> (你的答案: <span style="color:red;">${m.yourAnswer}</span>)</li>`;
            });
            html += '</ul>';
            mistakesList.innerHTML = html;
        } else {
            mistakesList.innerHTML = '<h3 style="color:green;">太棒了！這次全對滿分！ 🎉</h3>';
        }

        // 更新首頁的錯題按鈕數量
        updateReviewButton();
    }

    function resetQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    // --- 歷史紀錄相關功能 ---
    function saveHistory(currentScore, totalScore, currentMistakes, modeTag) {
        let history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
        const now = new Date();
        const dateString = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        history.push({ 
            date: dateString, 
            score: currentScore, 
            total: totalScore,
            mistakes: currentMistakes,
            tag: modeTag
        });
        localStorage.setItem('vocabQuizHistory', JSON.stringify(history));
    }

    function viewHistory() {
        const history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
        const content = document.getElementById('history-content');
        
        if (history.length === 0) {
            content.innerHTML = '<p style="text-align: center; color: #666;">目前尚無測驗紀錄</p>';
        } else {
            let html = '<div style="list-style: none; padding: 0; margin: 0;">';
            // 將陣列反轉顯示最新紀錄
            [...history].reverse().forEach((record, index) => {
                const total = record.total || 20; 
                const recordMistakes = record.mistakes || [];
                const tagStr = record.tag || ""; // 標示是否為特訓模式

                html += `
                <div class="history-item">
                    <div class="history-header">
                        <span style="font-size: 14px;">${record.date} ${tagStr}<br>得分: <b>${record.score} / ${total}</b></span>
                        <button class="btn-secondary btn-small" onclick="toggleDetails(${index})">查看檢討</button>
                    </div>
                    <div id="details-${index}" class="history-details hidden">
                `;

                if (recordMistakes.length > 0) {
                    html += '<h4 style="margin: 0 0 10px 0; color: #dc3545;">錯題與未作答：</h4><ul>';
                    recordMistakes.forEach(m => {
                        html += `<li>
                            <b>${m.en}</b><br>
                            <span style="color:#666; font-size: 13px;">正確: <span style="color:green;">${m.correct}</span> | 你的答案: <span style="color:red;">${m.yourAnswer}</span></span>
                        </li>`;
                    });
                    html += '</ul>';
                } else {
                    html += '<p style="color: green; margin: 0; font-weight: bold;">太棒了！這次測驗全對滿分！ 🎉</p>';
                }
                html += `</div></div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('history-screen').classList.remove('hidden');
    }

    function toggleDetails(index) {
        const detailsDiv = document.getElementById(`details-${index}`);
        if (detailsDiv.classList.contains('hidden')) {
            detailsDiv.classList.remove('hidden');
        } else {
            detailsDiv.classList.add('hidden');
        }
    }

    function closeHistory() {
        document.getElementById('history-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function clearHistory() {
        if(confirm('確定要清除所有測驗紀錄嗎？錯題本也會跟著清空喔！')) {
            localStorage.removeItem('vocabQuizHistory');
            updateReviewButton(); // 同步更新錯題按鈕
            viewHistory(); 
        }
    }
</script>

</body>
</html>
