<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界通史單字測驗</title>
<style>
    /* 基本變數與過渡效果 */
    :root {
        --bg-color: #f0f2f5;
        --container-bg: white;
        --text-color: #333;
        --text-muted: #666;
        --primary-color: #0056b3;
        --primary-hover: #004494;
        --input-bg: #fff;
        --input-border: #ccc;
        --history-bg: #f8f9fa;
        --history-border: #eee;
        --history-item-border: #dee2e6;
    }

    body.dark-mode {
        --bg-color: #18191a;
        --container-bg: #242526;
        --text-color: #e4e6eb;
        --text-muted: #b0b3b8;
        --primary-color: #4da3ff;
        --primary-hover: #338df2;
        --input-bg: #3a3b3c;
        --input-border: #555;
        --history-bg: #3a3b3c;
        --history-border: #555;
        --history-item-border: #444;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
    }

    /* 右上角深色模式切換鈕 */
    #theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--container-bg);
        color: var(--text-color);
        border: 2px solid var(--input-border);
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: all 0.3s;
        z-index: 1000;
    }
    #theme-toggle:hover {
        transform: scale(1.1);
    }

    .quiz-container {
        background-color: var(--container-bg);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
        transition: background-color 0.3s, box-shadow 0.3s;
    }
    h1 {
        color: var(--text-color);
        font-size: 24px;
        margin-bottom: 20px;
    }
    .question-info {
        color: var(--text-muted);
        margin-bottom: 15px;
        font-size: 16px;
    }
    .english-word {
        font-size: 32px;
        color: var(--primary-color);
        font-weight: bold;
        margin-bottom: 20px;
    }
    input[type="text"] {
        width: 80%;
        padding: 10px;
        font-size: 18px;
        background-color: var(--input-bg);
        color: var(--text-color);
        border: 2px solid var(--input-border);
        border-radius: 5px;
        margin-bottom: 20px;
        outline: none;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }
    input[type="text"]:focus {
        border-color: var(--primary-color);
    }
    button {
        background-color: var(--primary-color);
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s, transform 0.1s;
        margin: 5px;
    }
    button:hover:not(:disabled) {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
    }
    button:active:not(:disabled) {
        transform: translateY(0);
    }
    button:disabled {
        background-color: var(--input-border) !important;
        color: var(--text-muted) !important;
        cursor: not-allowed;
    }
    .btn-skip { background-color: #dc3545; }
    .btn-skip:hover:not(:disabled) { background-color: #c82333; }
    .btn-secondary { background-color: #6c757d; }
    .btn-secondary:hover:not(:disabled) { background-color: #5a6268; }
    .btn-warning { background-color: #ffc107; color: #212529; font-weight: bold; }
    .btn-warning:hover:not(:disabled) { background-color: #e0a800; }
    .btn-info { background-color: #17a2b8; }
    .btn-info:hover:not(:disabled) { background-color: #138496; }
    .btn-small { padding: 5px 10px; font-size: 14px; margin: 0; }
    
    .feedback {
        margin-top: 15px;
        font-size: 16px;
        font-weight: bold;
        min-height: 24px;
    }
    .correct { color: #28a745; }
    .incorrect { color: #dc3545; }
    .hidden { display: none !important; }
    #result-screen h2 { font-size: 28px; color: var(--text-color); }
    
    .history-list {
        text-align: left;
        max-height: 350px;
        overflow-y: auto;
        margin-bottom: 20px;
        padding: 10px;
        background: var(--history-bg);
        border-radius: 5px;
        border: 1px solid var(--history-border);
    }
    .history-item {
        margin-bottom: 10px;
        border-bottom: 1px solid var(--history-item-border);
        padding-bottom: 10px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-header { display: flex; justify-content: space-between; align-items: center; }
    .history-details {
        margin-top: 10px;
        background: var(--container-bg);
        padding: 10px;
        border-radius: 5px;
        border: 1px solid var(--history-border);
        font-size: 14px;
    }
    .history-details ul { padding-left: 20px; margin-bottom: 0; }
    .history-details li { margin-bottom: 8px; }

    /* 暫停畫面圖示動畫 */
    .pause-icon { font-size: 50px; margin-bottom: 10px; animation: pulse 2s infinite; }
    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
</head>
<body>

<button id="theme-toggle" onclick="toggleTheme()" title="切換深色/淺色模式">🌙</button>

<div class="quiz-container" id="start-screen">
    <h1>世界通史單字測驗</h1>
    <p style="color: var(--text-muted);">每次隨機抽取 20 題，顯示英文請輸入中文。</p>
    <p style="color: var(--text-muted); font-size: 14px;">（註：若有多個答案，填入其中一個即可）</p>
    <div>
        <button id="start-btn" onclick="startQuiz()" disabled>單字載入中...</button>
        <button class="btn-secondary" onclick="viewHistory()">歷史紀錄</button>
    </div>
    <div style="margin-top: 10px;">
        <button id="review-btn" class="btn-warning" onclick="startReviewQuiz()" disabled>錯題複習 (載入中...)</button>
    </div>
</div>

<div class="quiz-container hidden" id="history-screen">
    <h1>測驗歷史紀錄</h1>
    <div id="history-content" class="history-list"></div>
    <button onclick="closeHistory()">返回首頁</button>
    <button class="btn-skip" onclick="clearHistory()">清除紀錄</button>
</div>

<div class="quiz-container hidden" id="quiz-screen">
    <h1 id="quiz-title">世界通史單字測驗</h1>
    <div class="question-info" id="question-counter">題數: 1 / 20</div>
    <div class="english-word" id="english-word">English</div>
    <input type="text" id="answer-input" placeholder="請輸入中文..." onkeypress="handleKeyPress(event)">
    <br>
    <button id="submit-btn" onclick="checkAnswer()">提交</button>
    <button id="skip-btn" class="btn-skip" onclick="skipQuestion()">我不會</button>
    <button id="pause-btn" class="btn-info" onclick="pauseQuiz()">⏸️ 暫離</button>
    <div class="feedback" id="feedback"></div>
</div>

<div class="quiz-container hidden" id="pause-screen">
    <div class="pause-icon">☕</div>
    <h1>測驗已暫停</h1>
    <p style="color: var(--text-muted); margin-bottom: 20px;">題目已暫時隱藏，準備好就可以繼續囉！</p>
    <button onclick="resumeQuiz()">▶️ 繼續測驗</button>
    <button class="btn-skip" onclick="quitQuiz()">⏹️ 結束並回首頁</button>
</div>

<div class="quiz-container hidden" id="result-screen">
    <h1>測驗結束！</h1>
    <h2 id="final-score">你的分數: 0 / 20</h2>
    <div id="mistakes-list" style="text-align: left; margin: 20px 0; max-height: 200px; overflow-y: auto; padding: 10px; background: var(--history-bg); border-radius: 5px;"></div>
    <button onclick="resetQuiz()">回首頁</button>
</div>

<script>
    let allVocab = []; 
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let mistakes = [];
    let sessionCorrects = []; 
    let waitingForNext = false;
    let isReviewMode = false;

    const jsonUrl = 'https://raw.githubusercontent.com/snowyen0909/loon-2/refs/heads/main/Qs.json';

    // 網頁載入初始化
    window.onload = async function() {
        initTheme(); // 初始化深色模式設定
        
        const startBtn = document.getElementById('start-btn');
        try {
            const response = await fetch(jsonUrl);
            if (!response.ok) throw new Error('網路連線發生問題');
            allVocab = await response.json();
            
            startBtn.innerText = '隨機測驗 20 題';
            startBtn.disabled = false;
            
            updateReviewButton();
        } catch (error) {
            console.error('載入單字表失敗:', error);
            startBtn.innerText = '載入失敗，請確認網址或重整網頁';
            startBtn.style.backgroundColor = '#dc3545';
        }
    };

    // --- 深色模式相關功能 ---
    function initTheme() {
        const savedTheme = localStorage.getItem('vocabQuizTheme');
        const themeBtn = document.getElementById('theme-toggle');
        // 如果曾設定為 dark，或系統偏好深色且未設定過
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
            themeBtn.innerText = '☀️';
        } else {
            themeBtn.innerText = '🌙';
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        const themeBtn = document.getElementById('theme-toggle');
        
        if (isDark) {
            localStorage.setItem('vocabQuizTheme', 'dark');
            themeBtn.innerText = '☀️';
        } else {
            localStorage.setItem('vocabQuizTheme', 'light');
            themeBtn.innerText = '🌙';
        }
    }

    // --- 錯題庫相關功能 ---
    function getMistakeVocab() {
        let activeMistakes = JSON.parse(localStorage.getItem('vocabActiveMistakes'));
        if (!activeMistakes) {
            activeMistakes = [];
            let history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
            history.forEach(record => {
                if (record.mistakes) {
                    record.mistakes.forEach(m => {
                        if (!activeMistakes.includes(m.en)) activeMistakes.push(m.en);
                    });
                }
            });
            localStorage.setItem('vocabActiveMistakes', JSON.stringify(activeMistakes));
        }
        return allVocab.filter(vocab => activeMistakes.includes(vocab.en));
    }

    function updateMasterMistakes(correctWordsEn, wrongWordsEn) {
        let activeMistakes = JSON.parse(localStorage.getItem('vocabActiveMistakes')) || [];
        wrongWordsEn.forEach(en => { if (!activeMistakes.includes(en)) activeMistakes.push(en); });
        correctWordsEn.forEach(en => {
            const index = activeMistakes.indexOf(en);
            if (index > -1) activeMistakes.splice(index, 1);
        });
        localStorage.setItem('vocabActiveMistakes', JSON.stringify(activeMistakes));
    }

    function updateReviewButton() {
        const reviewBtn = document.getElementById('review-btn');
        if (!reviewBtn || allVocab.length === 0) return;

        const mistakeVocab = getMistakeVocab();
        if (mistakeVocab.length > 0) {
            reviewBtn.innerText = `💪 錯題特訓 (${mistakeVocab.length} 題)`;
            reviewBtn.disabled = false;
        } else {
            reviewBtn.innerText = `錯題特訓 (目前無錯題 🎉)`;
            reviewBtn.disabled = true;
        }
    }

    // --- 測驗流程相關功能 ---
    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startQuiz() {
        if (allVocab.length === 0) return;
        isReviewMode = false;
        const questionCount = Math.min(20, allVocab.length);
        startTestFlow(shuffleArray([...allVocab]).slice(0, questionCount), "世界通史單字測驗");
    }

    function startReviewQuiz() {
        const mistakeVocab = getMistakeVocab();
        if (mistakeVocab.length === 0) return;
        isReviewMode = true;
        const questionCount = Math.min(20, mistakeVocab.length);
        startTestFlow(shuffleArray([...mistakeVocab]).slice(0, questionCount), "💪 錯題特訓模式");
    }

    function startTestFlow(questions, title) {
        currentQuestions = questions;
        currentIndex = 0;
        score = 0;
        mistakes = [];
        sessionCorrects = []; 
        waitingForNext = false;

        document.getElementById('quiz-title').innerText = title;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('history-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('question-counter').innerText = `題數: ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('english-word').innerText = currentQuestions[currentIndex].en;
        document.getElementById('answer-input').value = '';
        document.getElementById('feedback').innerText = '';
        document.getElementById('answer-input').focus();
        
        document.getElementById('submit-btn').innerText = '提交';
        document.getElementById('skip-btn').classList.remove('hidden');
        document.getElementById('pause-btn').classList.remove('hidden'); // 顯示暫停按鈕
        waitingForNext = false;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            if (waitingForNext) nextQuestion();
            else checkAnswer();
        }
    }

    function checkAnswer() {
        if (waitingForNext) { nextQuestion(); return; }

        const input = document.getElementById('answer-input').value.trim();
        if (input === '') return; 

        const currentVocab = currentQuestions[currentIndex];
        const isCorrect = currentVocab.zh.some(ans => ans.trim() === input);
        const feedbackEl = document.getElementById('feedback');

        if (isCorrect) {
            score++;
            sessionCorrects.push(currentVocab.en); 
            feedbackEl.innerHTML = '<span class="correct">答對了！</span>';
        } else {
            const correctAnswersStr = currentVocab.zh.join(' 或 ');
            feedbackEl.innerHTML = `<span class="incorrect">答錯了，正確答案是：${correctAnswersStr}</span>`;
            mistakes.push({ en: currentVocab.en, yourAnswer: input, correct: correctAnswersStr });
        }

        setToNextState();
    }

    function skipQuestion() {
        if (waitingForNext) return;
        const currentVocab = currentQuestions[currentIndex];
        const correctAnswersStr = currentVocab.zh.join(' 或 ');
        const feedbackEl = document.getElementById('feedback');
        
        feedbackEl.innerHTML = `<span class="incorrect">未作答，正確答案是：${correctAnswersStr}</span>`;
        mistakes.push({ en: currentVocab.en, yourAnswer: "未作答", correct: correctAnswersStr });

        setToNextState();
    }

    function setToNextState() {
        waitingForNext = true;
        document.getElementById('submit-btn').innerText = '下一題';
        document.getElementById('skip-btn').classList.add('hidden'); 
        document.getElementById('pause-btn').classList.add('hidden'); // 答題後隱藏暫停按鈕
        document.getElementById('submit-btn').focus();
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    // --- 暫離功能 ---
    function pauseQuiz() {
        if (waitingForNext) return; // 如果已經送出答案，不允許暫停
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.remove('hidden');
    }

    function resumeQuiz() {
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        document.getElementById('answer-input').focus();
    }

    function quitQuiz() {
        if(confirm('確定要結束目前的測驗嗎？目前的進度將不會被記錄。')) {
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    }

    // --- 結果與歷史紀錄 ---
    function showResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = `你的分數: ${score} / ${currentQuestions.length}`;
        
        let modeTag = isReviewMode ? " (錯題特訓)" : "";
        saveHistory(score, currentQuestions.length, mistakes, modeTag);
        updateMasterMistakes(sessionCorrects, mistakes.map(m => m.en));

        const mistakesList = document.getElementById('mistakes-list');
        if (mistakes.length > 0) {
            let html = '<h3 style="color: var(--text-color);">需要複習的單字：</h3><ul>';
            mistakes.forEach(m => {
                html += `<li><b style="color: var(--primary-color);">${m.en}</b> - 正確: <span class="correct">${m.correct}</span> (你的答案: <span class="incorrect">${m.yourAnswer}</span>)</li>`;
            });
            html += '</ul>';
            mistakesList.innerHTML = html;
        } else {
            mistakesList.innerHTML = '<h3 class="correct">太棒了！這次全對滿分！ 🎉</h3>';
        }

        updateReviewButton();
    }

    function resetQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function saveHistory(currentScore, totalScore, currentMistakes, modeTag) {
        let history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
        const now = new Date();
        const dateString = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        history.push({ 
            date: dateString, 
            score: currentScore, 
            total: totalScore,
            mistakes: currentMistakes,
            tag: modeTag
        });
        localStorage.setItem('vocabQuizHistory', JSON.stringify(history));
    }

    function viewHistory() {
        const history = JSON.parse(localStorage.getItem('vocabQuizHistory')) || [];
        const content = document.getElementById('history-content');
        
        if (history.length === 0) {
            content.innerHTML = '<p style="text-align: center; color: var(--text-muted);">目前尚無測驗紀錄</p>';
        } else {
            let html = '<div style="list-style: none; padding: 0; margin: 0;">';
            [...history].reverse().forEach((record, index) => {
                const total = record.total || 20; 
                const recordMistakes = record.mistakes || [];
                const tagStr = record.tag || ""; 

                html += `
                <div class="history-item">
                    <div class="history-header">
                        <span style="font-size: 14px; color: var(--text-color);">${record.date} <span style="color: var(--text-muted);">${tagStr}</span><br>得分: <b style="color: var(--primary-color);">${record.score} / ${total}</b></span>
                        <button class="btn-secondary btn-small" onclick="toggleDetails(${index})">查看檢討</button>
                    </div>
                    <div id="details-${index}" class="history-details hidden">
                `;

                if (recordMistakes.length > 0) {
                    html += '<h4 class="incorrect" style="margin: 0 0 10px 0;">錯題與未作答：</h4><ul>';
                    recordMistakes.forEach(m => {
                        html += `<li>
                            <b style="color: var(--primary-color);">${m.en}</b><br>
                            <span style="color:var(--text-muted); font-size: 13px;">正確: <span class="correct">${m.correct}</span> | 你的答案: <span class="incorrect">${m.yourAnswer}</span></span>
                        </li>`;
                    });
                    html += '</ul>';
                } else {
                    html += '<p class="correct" style="margin: 0; font-weight: bold;">太棒了！這次測驗全對滿分！ 🎉</p>';
                }
                html += `</div></div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('history-screen').classList.remove('hidden');
    }

    function toggleDetails(index) {
        const detailsDiv = document.getElementById(`details-${index}`);
        detailsDiv.classList.toggle('hidden');
    }

    function closeHistory() {
        document.getElementById('history-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function clearHistory() {
        if(confirm('確定要清除所有測驗紀錄嗎？錯題本也會跟著清空喔！')) {
            localStorage.removeItem('vocabQuizHistory');
            localStorage.removeItem('vocabActiveMistakes'); 
            updateReviewButton(); 
            viewHistory(); 
        }
    }
</script>

</body>
</html>
